<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faydev Projects - Web Apps by Faris Adillah</title>
  <meta name="description" content="Central hub for all web applications built by Faydev. Browse, search, and access tools built by Faris Adillah Yufiansyah.">
  <meta name="keywords" content="Faydev, Faris Adillah Yufiansyah, Web Apps, Developer Tools, Portfolio, Projects, Software Engineer">
  <link rel="canonical" href="https://app.faydev.my.id">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://app.faydev.my.id/">
  <meta property="og:title" content="Faydev Projects">
  <meta property="og:description" content="Central hub for all web applications built by Faydev. Browse, search, and access tools built by Faris Adillah Yufiansyah.">
  <meta property="og:image" content="https://app.faydev.my.id/assets/og-image.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://app.faydev.my.id/">
  <meta property="twitter:title" content="Faydev Projectsk">
  <meta property="twitter:description" content="Central hub for all web applications built by Faydev. Browse, search, and access tools built by Faris Adillah Yufiansyah.">
  <meta property="twitter:image" content="https://app.faydev.my.id/assets/og-image.png">

  <!-- Preload Critical Assets -->
  <link rel="preload" as="image" href="assets/faris.webp">
  <link rel="preload" as="fetch" href="data.json" crossorigin>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="src/css/style.css">
  <script src="src/js/app.js" defer></script>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="manifest" href="favicon/site.webmanifest">
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="container navbar-inner">
      <a href="#" class="navbar-brand">
        <img src="assets/faydev.webp" alt="Faydev Logo" class="navbar-logo">
        <span class="navbar-brand-mark">Fay</span>
        <span class="navbar-brand-text">dev</span>
      </a>
      <ul class="navbar-menu">
        <li><a href="#" class="navbar-link">Home</a></li>
        <li><a href="https://github.com/FAYnim" target="_blank" rel="noopener noreferrer" class="navbar-link navbar-link--external">GitHub <i class="fa-solid fa-arrow-up-right-from-square fa-2xs"></i></a></li>
        <li><a href="mailto:admin@faydev.my.id" class="navbar-link">Contact</a></li>
      </ul>
    </div>
  </nav>

  <header class="hero" id="hero">
    <div class="container hero-inner">
      <div class="hero-photo-col">
        <div class="hero-photo-frame">
          <div class="hero-photo-placeholder">
            <img src="assets/faris.webp" alt="Faris Adillah Yufiansyah" class="hero-photo-img" fetchpriority="high">
            <!-- <i class="fa-solid fa-user"></i> -->
          </div>
        </div>
      </div>
      <div class="hero-info-col">
        <h1 class="hero-name">Faris Adillah<br>Yufiansyah</h1>
        <p class="hero-brand">Faydev</p>
        <div class="hero-bio">
          <p class="hero-bio-line"><span class="hero-bio-bullet"></span> Web Developer</p>
          <p class="hero-bio-line"><span class="hero-bio-bullet"></span> Builder of practical web applications</p>
          <p class="hero-bio-line"><span class="hero-bio-bullet"></span> Content Creator</p>
        </div>
        <div class="hero-socials">
          <a href="https://github.com/FAYnim" target="_blank" rel="noopener noreferrer" class="hero-social-link" aria-label="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
          <a href="https://instagram.com/fay.developer" target="_blank" rel="noopener noreferrer" class="hero-social-link" aria-label="Instagram">
            <i class="fa-brands fa-instagram"></i>
          </a>
          <a href="https://youtube.com/@faris.a.y" target="_blank" rel="noopener noreferrer" class="hero-social-link" aria-label="YouTube">
            <i class="fa-brands fa-youtube"></i>
          </a>
          <a href="https://www.linkedin.com/in/faris-ay" target="_blank" rel="noopener noreferrer" class="hero-social-link" aria-label="LinkedIn">
            <i class="fa-brands fa-linkedin-in"></i>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="directory" id="directory">
    <div class="container">

      <!-- Section Header -->
      <div class="directory-header">
        <div class="directory-header-text">
          <h2 class="directory-title">Applications</h2>
          <p class="directory-subtitle">Web applications built by Faydev</p>
        </div>
        <div class="directory-count" id="appCount">
          <span class="directory-count-number" id="appCountNumber">0</span>
          <span class="directory-count-label">Applications Built</span>
        </div>
      </div>

      <!-- Search & Filter Bar -->
      <div class="directory-controls">
        <div class="directory-search">
          <i class="fa-solid fa-magnifying-glass directory-search-icon"></i>
          <input
            type="text"
            id="searchInput"
            class="directory-search-input"
            placeholder="Search apps, tech, description..."
            autocomplete="off"
          >
        </div>
        <div class="directory-filters">
          <div class="directory-filter-group">
            <select id="filterCategory" class="directory-select">
              <option value="">All Categories</option>
            </select>
          </div>
          <div class="directory-filter-group">
            <select id="filterTech" class="directory-select">
              <option value="">All Tech</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Results info -->
      <div class="directory-results-info" id="resultsInfo"></div>

      <!-- App Grid -->
      <div class="directory-grid" id="appGrid">
        <!-- Cards rendered by JS -->
      </div>

      <!-- Empty State -->
      <div class="directory-empty" id="emptyState" style="display:none;">
        <i class="fa-solid fa-folder-open"></i>
        <p>No applications match your search.</p>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p class="footer-copy">&copy; 2026 Faydev</p>
      <a href="https://github.com/FAYnim" target="_blank" rel="noopener noreferrer" class="footer-link">
        <i class="fa-brands fa-github"></i> GitHub
      </a>
    </div>
  </footer>

  <script src="src/js/app.js"></script>
</body>
</html>
